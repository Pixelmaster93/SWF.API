name: Build & Deploy Multi-Arch

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pixelmaster93/swf.api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Installa QEMU (Emulatore per compilare ARM su Intel)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Installa Docker Buildx (Potenziamento per build multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 3. QUI LA MAGIA: Diciamo di costruire per entrambe le architetture
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Fix per l'errore git "dubious ownership" che hai visto prima
            git config --global --add safe.directory /www/wwwroot/swf_api
            
            cd /www/wwwroot/swf_api
            
            # Scarica le definizioni (anche se qui cambia poco nel docker-compose)
            git pull origin develop
            
            # Scarica la nuova immagine ARM64
            # IMPORTANTE: sudo è necessario se non hai configurato il gruppo docker
            sudo docker compose pull
            
            # Riavvia tutto
            sudo docker compose up -d
            
            # Pulisci
            sudo docker image prune -f