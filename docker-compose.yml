services:
  swf-postgres:
    image: postgres:15-alpine
    container_name: swf-postgres
    environment:
      - POSTGRES_DB=ShitWithFriend
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=PasswordSegreta123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swf-net
    restart: always

  swf-api:
    container_name: swf-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__SWFDbConnectionString=Host=swf-postgres;Port=5432;Database=ShitWithFriend;Username=admin;Password=PasswordSegreta123!

      # --- MODIFICA FONDAMENTALE ---
      # Usiamo HTTP interno (veloce) e il nome esatto del container Keycloak
      - Authentication__Authority=http://keycloak-keycloak-1:8080/realms/ShitWithFriend
      - Authentication__Audience=swf-api

      # Sicurezza: Accettiamo il certificato anche se non usiamo HTTPS internamente
      - ASPNETCORE_Kestrel__Certificates__Default__AllowInvalid=true

      # Log di debug per vedere se tutto funziona
      - Logging__LogLevel__Microsoft.AspNetCore.Authentication=Debug

    ports:
      - "5000:8080"
    volumes:
      - ./swf_data:/app/data
    restart: always
    depends_on:
      - swf-postgres

    # Colleghiamo l'API alla rete condivisa
    networks:
      - swf-net

# Definiamo la rete come "esterna" (perché l'hai creata tu a mano prima)
networks:
  swf-net:
    external: true

volumes:
  postgres_data:
